name: Masroof

options:
  bundleIdPrefix: com.app
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"

targets:
  Masroof:
    type: application
    platform: iOS
    sources:
      - path: Masroof
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.app.masroof
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Support/Info.plist

schemes:
  Masroof:
    build:
      targets:
        Masroof: all
    run:
      config: Debug
    archive:
      config: Release
